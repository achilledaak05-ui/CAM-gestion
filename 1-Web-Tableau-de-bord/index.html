<style>
:root{--bg:#f6f3fb;--sf:#fff;--ink:#241638;--mut:#6b5f80;--ln:#e4dcf2;--p1:#3b1670;--p2:#7c3aed;--p3:#ede9fe;--gold:#c9a227;--ok:#15803d;--bad:#b91c1c;--font:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150d24;--sf:#21143a;--ink:#f1eafd;--mut:#a99bc4;--ln:#382859;--p1:#2a1050;--p2:#a78bfa;--p3:#33215a;--gold:#e2c04a;--ok:#4ade80;--bad:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#150d24;--sf:#21143a;--ink:#f1eafd;--mut:#a99bc4;--ln:#382859;--p1:#2a1050;--p2:#a78bfa;--p3:#33215a;--gold:#e2c04a;--ok:#4ade80;--bad:#f87171;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.5}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
nav{background:var(--p1);color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
nav h1{font-size:17px;font-weight:800;margin:0 8px 2px;line-height:1.2;display:flex;gap:8px;align-items:center}
nav h1 img{width:34px;height:34px;object-fit:contain;border-radius:8px;background:#fff}
nav small{display:block;margin:0 8px 14px;color:#cbb8f5;font-size:12px}
nav button{display:flex;gap:9px;align-items:center;width:100%;background:none;border:0;color:#e2d6fb;font:inherit;font-size:14.5px;padding:8px 12px;border-radius:10px;cursor:pointer;text-align:left}
nav button:hover{background:rgba(255,255,255,.08)}
nav button.on{background:#fff;color:var(--p1);font-weight:600}
nav select{background:rgba(255,255,255,.12);color:#fff;border:0;margin-top:12px}
nav select option{color:#000}
main{padding:26px clamp(14px,3vw,38px);max-width:1150px;width:100%}
h2{font-size:27px;font-weight:800;margin:0 0 4px;color:var(--p2)}
.sub{color:var(--mut);margin:0 0 18px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:18px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:16px}
.stat b{display:block;font-size:23px;font-weight:800;color:var(--p2);line-height:1.2}.stat span{color:var(--mut);font-size:14px}
.stat.gold{border-top:3px solid var(--gold)}
h3{margin:0 0 10px;font-size:17px}
.btn{background:var(--p2);color:#fff;border:0;border-radius:10px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.1)}.alt{background:var(--p3);color:var(--p2)}
.del,.ed{background:none;border:0;cursor:pointer;font:inherit;padding:4px 7px}.del{color:var(--bad)}.ed{color:var(--p2)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:9px 12px;width:100%}
.bar input,.bar select{width:auto;min-width:150px}
.tw{overflow-x:auto;background:var(--sf);border:1px solid var(--ln);border-radius:14px;margin-bottom:14px}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:10px 13px;text-align:left;border-bottom:1px solid var(--ln);font-size:14.5px;vertical-align:middle}
th{background:var(--p3);color:var(--p2);font-weight:600}tr:last-child td{border-bottom:0}
.tag{display:inline-block;background:var(--p3);color:var(--p2);border-radius:20px;padding:2px 10px;font-size:12.5px;font-weight:600}
.tag.w{background:#fef3c7;color:#92400e}.tag.g{background:#dcfce7;color:#166534}
/* ---------- Finances : charte couleurs (bleu / rouge / jaune / orange / vert / doré / blanc) ---------- */
:root{
  --fin-entree:#2563eb;--fin-depense:#dc2626;--fin-solde:#eab308;--fin-offrande:#16a34a;--fin-dime:#c9a227;--fin-don:#ffffff;--fin-projet:#ff6a13;--fin-action:#ff6a13;
  --fin-entree-ink:#fff;--fin-depense-ink:#fff;--fin-solde-ink:#241638;--fin-offrande-ink:#fff;--fin-dime-ink:#241638;--fin-don-ink:#241638;--fin-projet-ink:#fff
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --fin-entree:#60a5fa;--fin-depense:#f87171;--fin-solde:#facc15;--fin-offrande:#4ade80;--fin-dime:#e2c04a;--fin-projet:#ff8a3d;--fin-action:#ff8a3d;
  --fin-entree-ink:#0b1220;--fin-depense-ink:#2a0a0a;--fin-solde-ink:#2a1f00;--fin-offrande-ink:#052e16;--fin-dime-ink:#2a1f00;--fin-projet-ink:#2a1200
}}
:root[data-theme="dark"]{
  --fin-entree:#60a5fa;--fin-depense:#f87171;--fin-solde:#facc15;--fin-offrande:#4ade80;--fin-dime:#e2c04a;--fin-projet:#ff8a3d;--fin-action:#ff8a3d;
  --fin-entree-ink:#0b1220;--fin-depense-ink:#2a0a0a;--fin-solde-ink:#2a1f00;--fin-offrande-ink:#052e16;--fin-dime-ink:#2a1f00;--fin-projet-ink:#2a1200
}
.stat[class*="fin-"]{border-top-width:3px;border-top-style:solid}
.stat[class*="fin-"] b{color:inherit}
.stat[class*="fin-"] span{color:inherit;opacity:.85}
.stat.fin-entree{background:var(--fin-entree);border-color:var(--fin-entree);color:var(--fin-entree-ink)}
.stat.fin-depense{background:var(--fin-depense);border-color:var(--fin-depense);color:var(--fin-depense-ink)}
.stat.fin-solde{background:var(--fin-solde);border-color:var(--fin-solde);color:var(--fin-solde-ink)}
.stat.fin-offrande{background:var(--fin-offrande);border-color:var(--fin-offrande);color:var(--fin-offrande-ink)}
.stat.fin-dime{background:var(--fin-dime);border-color:var(--fin-dime);color:var(--fin-dime-ink)}
.stat.fin-don{background:var(--fin-don);border-color:#d9d2e9;color:var(--fin-don-ink)}
.stat.fin-projet{background:var(--fin-projet);border-color:var(--fin-projet);color:var(--fin-projet-ink)}
.btn.fin-action{background:var(--fin-action);color:#fff}
.btn.fin-action:hover{filter:brightness(1.08)}
.in{color:var(--fin-entree);font-weight:600}.out{color:var(--fin-depense);font-weight:600}.r{text-align:right}
.empty{padding:22px;text-align:center;color:var(--mut)}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{background:var(--p3);color:var(--p2);border:0;border-radius:20px;padding:7px 16px;font:inherit;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--p2);color:#fff}
.ph{width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--p2);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;vertical-align:middle;margin-right:8px}
.ov{position:fixed;inset:0;background:rgba(20,8,40,.6);display:flex;align-items:center;justify-content:center;padding:14px;z-index:20}
.md{background:var(--sf);border-radius:16px;padding:20px;width:100%;max-width:460px;max-height:92vh;overflow:auto}.md.wide{max-width:720px}
.md label{display:block;font-size:13.5px;color:var(--mut);margin:9px 0 3px}
.chk{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin:10px 0}
.chk label{display:flex;gap:8px;align-items:center;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:7px 11px;cursor:pointer}.chk input{width:auto}
.paper{background:#fff;color:#241638;padding:22px;border-radius:8px;border:1px solid #ddd}.paper table{min-width:0}.paper th{background:#ede9fe}.paper td,.paper th{color:#241638}
.hd{display:flex;gap:12px;align-items:center;border-bottom:3px solid #7c3aed;padding-bottom:8px;margin-bottom:12px;font-weight:800;font-size:18px}.hd img{height:46px}
.sig{margin-top:34px;border-top:1px solid #999;width:200px;padding-top:4px;font-size:13px}
.cert{background:#fffdf7;color:#2b1850;padding:16px;border-radius:4px;position:relative}
.ci{border:4px solid #7c3aed;outline:2px solid #c9a227;outline-offset:-12px;padding:34px 26px;text-align:center;position:relative}
.ci::before,.ci::after{content:"❖";position:absolute;color:#c9a227;font-size:24px;top:8px}.ci::before{left:12px}.ci::after{right:12px}
.ch{font-weight:800;font-size:19px;color:#3b1670}.ct{font-size:26px;font-weight:800;color:#7c3aed;margin:10px 0}
.cn{font-size:30px;font-weight:800;border-bottom:2px solid #c9a227;display:inline-block;padding:0 24px;margin:6px 0}
.ci .sig{margin:30px auto 0;text-align:center}
textarea.big{min-height:140px;font-family:ui-monospace,monospace;font-size:12.5px}
.fiche{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}.fiche .ph{width:96px;height:96px;font-size:34px;margin:0}
.qr{width:110px;background:#fff;padding:6px;border-radius:8px}
.offering-qr{margin-bottom:14px}
.offering-qr summary{color:var(--p2);font-weight:700;cursor:pointer}
.offering-qr-body{display:flex;align-items:center;gap:14px;margin-top:12px}
.offering-qr .qr{width:122px;flex:0 0 122px}
.offering-qr-copy{min-width:0}
.offering-qr-copy p{margin:0 0 6px}
.offering-qr-copy code{display:block;color:var(--mut);font-size:12px;overflow-wrap:anywhere}
.offering-qr-copy .btn{display:inline-block;text-decoration:none;margin:6px 0}
.offering-qr-warning{color:var(--bad);font-size:13px;margin-top:8px}
@media(max-width:520px){.offering-qr-body{align-items:flex-start;flex-direction:column}}
.attendance-qr .bar{margin:12px 0}
.attendance-qr .qr{width:160px;max-width:100%;flex:0 0 160px}
.attendance-qr .qr svg{display:block;width:100%;height:auto}
.attendance-qr .qr-code{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.attendance-qr .qr-copy{min-width:0;flex:1}
.attendance-qr .qr-copy code{display:block;overflow-wrap:anywhere;color:var(--mut);font-size:12px;margin:6px 0}
.attendance-qr .qr-warning{color:var(--bad);font-size:13px;margin:8px 0}
.att-header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.att-kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.att-filters{align-items:flex-end}
.att-filters input[type=search]{min-width:190px}
.att-filters label{font-size:12px;color:var(--mut)}
.att-filters select{width:auto;min-width:150px}
.att-avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;display:inline-grid;place-items:center;background:var(--p3);color:var(--p2);font-weight:700}
.att-sort{background:none;border:0;color:inherit;font:inherit;font-weight:600;cursor:pointer;padding:0;text-align:left}
.att-pagination{justify-content:flex-end;align-items:center}
.att-pagination select{width:auto}
.att-pagination span{margin-right:auto;color:var(--mut);font-size:13px}
.att-alert{padding:12px 14px;border:1px solid var(--gold);border-radius:12px;background:color-mix(in srgb,var(--gold) 12%,var(--sf));color:var(--ink);margin:0 0 12px}
.att-chart-row{display:grid;grid-template-columns:62px minmax(80px,1fr) 32px;gap:8px;align-items:center;margin:10px 0;font-size:13px}
.att-chart-row>div{height:10px;border-radius:8px;background:var(--p3);overflow:hidden}
.att-chart-row i{display:block;height:100%;border-radius:8px;background:var(--p2)}
.att-chart-row b{text-align:right}
.att-tabs{margin-top:8px}
.att-session{display:grid;grid-template-columns:minmax(180px,300px) 1fr;gap:4px 14px;align-items:center}
.att-session .sub{margin:0}
.att-session .tag{justify-self:start}
@media(max-width:640px){.att-session{grid-template-columns:1fr}.att-filters input[type=date]{width:100%}.att-pagination{justify-content:flex-start}.att-pagination span{flex-basis:100%}}

body{background:radial-gradient(1100px 520px at 100% -8%,rgba(124,58,237,.16),transparent 70%),var(--bg)}
.colw{min-width:0}.app{transition:grid-template-columns .35s cubic-bezier(.2,.8,.2,1)}.app.cl{grid-template-columns:80px 1fr}
nav{background:linear-gradient(180deg,#2a0f55,#4c1d95 70%,#5b21b6);overflow-x:hidden;animation:sl .7s cubic-bezier(.2,.8,.2,1) both}
nav h1 img{width:34px;height:34px}
.navw{position:relative}.ind{position:absolute;left:0;right:0;top:0;height:40px;background:#fff;border-radius:12px;box-shadow:0 8px 22px rgba(0,0,0,.28);transition:transform .45s cubic-bezier(.3,1.25,.4,1),height .3s;opacity:0}
.ind::before{content:"";position:absolute;left:-7px;top:11px;bottom:11px;width:4px;border-radius:4px;background:var(--gold)}
nav button{position:relative;z-index:1;overflow:hidden;height:40px;margin-bottom:2px;transition:color .25s}nav button.on{background:none;color:var(--p1)}nav button.on::after{display:none}
.app.cl .lb,.app.cl nav h1 span,.app.cl nav small{display:none}.app.cl nav button{justify-content:center}
.top{position:sticky;top:0;z-index:8;display:flex;align-items:center;gap:10px;padding:10px clamp(14px,3vw,38px);background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--ln)}
.spc{flex:1}.mob{display:none}
.bc{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--mut)}.bc b{color:var(--ink)}.bc span{animation:bci .4s both}.bc span:nth-child(2){animation-delay:.05s}.bc span:nth-child(3){animation-delay:.1s}.bc span:nth-child(4){animation-delay:.15s}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);cursor:pointer;font-size:17px;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s;display:inline-grid;place-items:center}
.ib:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(76,29,149,.2)}.sm{width:30px;height:30px;font-size:14px}
.spin span{display:inline-block;animation:spn .8s linear infinite}
.av2{width:40px;height:40px;border-radius:50%;border:0;background:linear-gradient(135deg,#7c3aed,#c9a227);color:#fff;font-weight:700;cursor:pointer;font:inherit;font-weight:700}
.bell{overflow:visible}.bd{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;border-radius:9px;background:#ef4444;color:#fff;font-size:10px;font-style:normal;display:grid;place-items:center;animation:pu 2s infinite}.bell.sh{animation:shk .9s}
.top .sx,.bar .sx{width:160px}.top .sx:focus,.bar .sx:focus{width:300px;box-shadow:0 0 0 3px rgba(124,58,237,.25);border-color:var(--p2)}.sx{transition:width .35s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.dd{position:relative}.pan{position:absolute;right:0;top:calc(100% + 10px);min-width:260px;background:var(--sf);border:1px solid var(--ln);border-radius:16px;box-shadow:0 24px 60px rgba(40,10,90,.28);padding:8px;opacity:0;visibility:hidden;transform:translateY(-10px) scale(.96);transform-origin:top right;transition:opacity .22s,transform .25s,visibility .22s;z-index:30}
.dd.open .pan{opacity:1;visibility:visible;transform:none}
.mega{width:min(600px,90vw);display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;padding:14px}.mega>div>b{display:block;color:var(--p2);padding:4px 10px}
.dd.open .mega>div{animation:up .4s both;animation-delay:calc(var(--i)*70ms)}
.mi{display:block;width:100%;text-align:left;background:none;border:0;color:var(--ink);font:inherit;font-size:14.5px;padding:8px 10px;border-radius:10px;cursor:pointer;transition:background .2s,padding .2s}.mi:hover{background:var(--p3);color:var(--p2);padding-left:15px}
.card{border-radius:18px;box-shadow:0 1px 2px rgba(40,10,90,.05),0 10px 28px rgba(40,10,90,.07);transition:transform .28s,box-shadow .28s}.card:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(76,29,149,.2)}
.btn,.tabs button,.fab,.sdi{position:relative;overflow:hidden}.btn{box-shadow:0 6px 16px rgba(124,58,237,.3);transition:transform .2s,box-shadow .2s,filter .2s}.btn:hover{transform:translateY(-2px)}.btn:active{transform:none}
.rip{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:rp .65s ease-out;pointer-events:none}.alt .rip,.tabs button .rip,.ib .rip{background:rgba(124,58,237,.3)}
.hero{position:relative;overflow:hidden;background:linear-gradient(120deg,#3b1670,#6d28d9 55%,#a855f7);border-radius:20px;padding:16px;color:#fff;margin-bottom:16px}
.hero h2{color:#fff;margin:2px 0}.hero p{margin:0;opacity:.85}.hero small{opacity:.8}
.orb{position:absolute;border-radius:50%;filter:blur(42px);opacity:.5;animation:fl 9s ease-in-out infinite alternate}.o1{width:230px;height:230px;background:#c9a227;right:-50px;top:-70px}.o2{width:210px;height:210px;background:#ec4899;left:35%;bottom:-130px;animation-delay:-4s}
.hh{position:relative;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}.lu{text-align:right;font-size:13px;opacity:.95}.lu .btn{margin-top:6px}
.glass{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(10px);box-shadow:none}.glass:hover{background:rgba(255,255,255,.3)}
.kg{position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:12px}
/* ---------- Accueil : panneaux Départements / Activités / Cultes (compact) ---------- */
.kg-info{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.kg-info .card{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(12px);color:#fff;min-width:0;padding:11px 12px}
.kg-info .card h3{color:#fff;font-size:15px;margin-bottom:6px}
.kg-info .tag{background:rgba(255,255,255,.2);color:#fff;white-space:nowrap;flex:none;font-size:11px;padding:2px 8px}
.kg-info .tag.w,.kg-info .tag.g{color:#241638}
.ki-row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.18);font-size:13px}
.ki-sub{color:rgba(255,255,255,.78);font-size:11.5px;margin-top:2px}
.ki-chips{display:flex;flex-wrap:wrap;gap:6px;padding-top:2px}
.ki-chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);border-radius:20px;padding:3px 9px;font-size:12px;white-space:nowrap}
.ki-chip span{opacity:.75}
.kg-info .empty{color:rgba(255,255,255,.75);padding:12px 6px;font-size:13px}
.flip{perspective:900px;height:132px;cursor:pointer}.fi{position:relative;height:100%;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.3,1.2,.4,1)}.flip.on .fi{transform:rotateY(180deg)}
.ff,.fk{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:14px 16px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(12px);transition:background .25s,box-shadow .25s,transform .25s}
.fk{transform:rotateY(180deg);display:flex;align-items:center;font-size:14px;line-height:1.4}.flip:hover .ff,.flip:hover .fk{background:rgba(255,255,255,.27);box-shadow:0 12px 32px rgba(0,0,0,.28)}
.kl{opacity:.9;font-size:14px;display:flex;gap:8px;align-items:center}.ico{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:10px;background:rgba(255,255,255,.2);animation:pu 3s infinite}
.ff b{display:block;font-size:23px;font-weight:800;margin:7px 0 3px;line-height:1.2}.trd{font-size:12.5px;padding:2px 9px;border-radius:20px;background:rgba(255,255,255,.2)}

  const resp=find("members",d.resp);
  const photo=d.photo?`<img src="${d.photo}" alt="">`:(resp&&resp.photo?`<img src="${resp.photo}" alt="">`:`<span>${init(d.nom)}</span>`);
  const nb=S.members.filter(m=>m.dept===d.id).length;
  return `<article class="idcard deptcard">
    <div class="idc-head"><div class="idc-logo">${S.cfg.logo?`<img src="${S.cfg.logo}" alt="">`:"CAM"}</div><div><b>${esc(S.cfg.name)}</b><small>CARTE DE DÉPARTEMENT</small></div></div>
    <div class="idc-body"><div class="idc-photo">${photo}</div><div class="idc-info"><b class="idc-nom">${esc(d.nom)}</b>
      <dl><dt>Responsable</dt><dd>${esc(resp?resp.nom:"—")}</dd><dt>Membres</dt><dd>${nb}</dd><dt>Description</dt><dd>${esc((d.desc||"—").slice(0,34))}</dd></dl></div></div>
    <div class="idc-foot"><div class="idc-qr">${qr("CAM|DEPT|"+d.id+"|"+d.nom)}</div><div><small>${esc(d.nom)}<br>Département · Communauté CAM<br>${nb} membre(s) rattaché(s)</small></div></div>
  </article>`;
}
function voirCarteMembre(id){const m=find("members",id);if(m)showM(`<div class="planche une">${carteMembre(m)}</div>`)}
function voirCarteDept(id){const d=find("depts",id);if(d)showM(`<div class="planche une">${carteDept(d)}</div>`)}
function car(){
  const [t,tb]=tabs(["Cartes de membre","Cartes de département"]),q=(CAR_Q||"").toLowerCase();
  let L,cartes,aide;
  if(t==="Cartes de membre"){
    L=S.members.filter(m=>(m.nom+" "+(m.mat||"")+" "+nm("depts",m.dept)).toLowerCase().includes(q));
    cartes=L.map(carteMembre).join("");
    aide="Ajoutez une photo depuis <b>Membres → Modifier</b>. Le matricule et le QR sont générés automatiquement.";
  }else{
    L=S.depts.filter(d=>(d.nom+" "+nm("members",d.resp)).toLowerCase().includes(q));
    cartes=L.map(carteDept).join("");
    aide="Ajoutez une photo depuis <b>Départements → Modifier</b>. À défaut, la photo du responsable est utilisée.";
  }
  return hdr("Cartes & badges",`${L.length} carte(s) disponible(s) — prêtes à imprimer.`,
    `<input type="search" id="carq" class="sx" placeholder="Filtrer…" value="${esc(CAR_Q)}" aria-label="Filtrer les cartes"><button class="btn" onclick="imprimerCartes()">🖨 Imprimer la planche</button><span style="color:var(--mut);font-size:13px">Format carte bancaire · 4 par page A4</span>`)
    +tb+`<div class="card noprint" style="margin-bottom:14px"><h3>Photos</h3><p class="cards-help">${aide} Les photos sont redimensionnées et enregistrées localement sur cet appareil.</p>
      <div class="bar" style="margin:12px 0 0">${t==="Cartes de département"?`<button class="btn alt" onclick="voirCarteDept(S.depts[0]&&S.depts[0].id)">Aperçu d'une carte</button>`:""}</div></div>`
    +`<div id="planche" class="planche">${cartes||'<div class="empty">Aucune carte à afficher.</div>'}</div>`;
}

/* ---- Enregistrement d'un membre vers PostgreSQL ---- */
function syncMembre(o,existe){
  if(!SESSION||!accesComplet())return;
  const p=String(o.nom||"").trim().split(/\s+/),nom=p.length>1?p.slice(1).join(" "):(p[0]||"Membre"),prenom=p.length>1?p[0]:(p[0]||"Membre");
  const d=find("depts",o.dept);
  const payload={matricule:o.mat||"",nom:nom,prenom:prenom,tel:o.tel||"",email:o.email||"",adresse:o.adresse||"",
    departement:d?d.nom:"",naissance:o.naissance||"",notes:o.prof||"",
    statut:({"Membre":"actif","Nouveau converti":"nouveau converti","Visiteur":"visiteur"})[o.statut]||"actif"};
  const url=existe?'/api/admin/members/'+encodeURIComponent(o.id):'/api/admin/members';
  fetch(url,{method:existe?'PATCH':'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
    .then(r=>{if(!r.ok)throw new Error("Erreur "+r.status);return existe?null:r.json()})
    .then(d=>{if(d&&d.id){o.id=d.id;save()}})
    .catch(()=>toast("Enregistré sur cet appareil (serveur indisponible)","warn"));
}

/* ---- Comptes d'accès (backend) ---- */
function creerAcces(){
  if(roleCourant()!=="admin_general"){toast("Réservé à l'administrateur","warn");return}
  const id=$("nu-id").value.trim(),pw=$("nu-pw").value,role=$("nu-role").value,msg=$("nu-msg");
  if(id.length<3||pw.length<12){msg.textContent="Identifiant (3+) et mot de passe (12+) requis.";return}
  msg.textContent="Création…";
  const department=$("nu-dept").value;
  if(role==="responsable"&&!department){msg.textContent="Choisissez le département du responsable.";return}
  fetch('/api/admin/users',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifiant:id,password:pw,role,department})})
    .then(r=>r.text().then(t=>{let d={};try{d=t?JSON.parse(t):{}}catch(e){};if(!r.ok)throw new Error(d.message||"Erreur "+r.status);return d}))
    .then(()=>{msg.textContent="✓ Compte créé (inactif). Activez-le ci-dessous.";toast("Compte responsable créé");return hydrate()})
    .then(()=>render()).catch(e=>{msg.textContent=e.message});
}
function affecterDepartement(id){
  if(roleCourant()!=="admin_general"){toast("Réservé à l'administrateur","warn");return}
  const department=$("dept-"+id).value;
  fetch('/api/admin/users/'+encodeURIComponent(id)+'/department',{method:'PATCH',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({department})})
    .then(r=>r.text().then(t=>{let d={};try{d=t?JSON.parse(t):{}}catch(e){}if(!r.ok)throw new Error(d.message||"Erreur "+r.status);return d}))
    .then(()=>hydrate()).then(()=>{render();toast("Département attribué")})
    .catch(e=>toast(e.message||"Attribution impossible","warn"));
}
function activerAcces(id,actif){
  if(roleCourant()!=="admin_general"){toast("Réservé à l'administrateur","warn");return}
  fetch('/api/admin/users/'+encodeURIComponent(id)+'/activation',{method:'PATCH',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({active:actif})})
    .then(r=>{if(!r.ok)throw new Error("Erreur "+r.status);return hydrate()}).then(()=>{render();toast(actif?"Compte activé":"Compte désactivé")}).catch(e=>toast(e.message||"Action impossible","warn"));
}

/* ---- Synchronisation avec le serveur CAM ---- */
function apiJSON(u){return fetch(u,{credentials:'same-origin'}).then(r=>r.ok?r.json():null).catch(()=>null)}
function assureDept(nom){
  nom=(nom||"").trim();if(!nom)return"";
  let d=S.depts.find(x=>x.nom.toLowerCase()===nom.toLowerCase());
  if(!d){d={id:uid(),nom:nom,resp:"",desc:"",photo:""};S.depts.push(d)}
  return d.id;
}
function hydrate(){
  return Promise.all([
    apiJSON('/api/admin/members'),apiJSON('/api/admin/events'),
    apiJSON('/api/admin/users'),apiJSON('/api/admin/attendance'),apiJSON('/api/admin/registrations')
  ]).then(([mb,ev,us,at,regs])=>{
    /* Membres réels, en conservant les photos déjà enregistrées localement */
    const lm=(mb&&mb.members)||[];
    if(mb){
      const photos=new Map(S.members.map(m=>[(m.nom||"").toLowerCase(),m]));
      S.members=lm.map((m,i)=>{
        const nom=([m.prenom,m.nom].filter(Boolean).join(" ")||m.nom||"Membre").trim();
        const old=photos.get(nom.toLowerCase())||{};
        return {id:m.id,mat:m.matricule||old.mat||("CAM-"+String(i+1).padStart(4,"0")),nom:nom,prenom:m.prenom||old.prenom||"",tel:m.tel||"",
          sexe:old.sexe||"",naissance:m.naissance||"",adresse:m.adresse||"",prof:old.prof||"",
          dept:assureDept(m.departement||old.deptNom),eg:S.eglises[0]?S.eglises[0].id:"",
          statut:m.statut==="actif"?"Membre":"Visiteur",photo:old.photo||""};
      });
      /* Le module Membres gère des statuts plus riches que le serveur
         (Inactif, Transféré…). On conserve ceux saisis localement. */
      if(S.memExt)S.members.forEach(m=>{const ex=S.memExt[m.id];if(!ex)return;
        if(ex.statut)m.statut=ex.statut;
        if(ex.dept!==undefined)m.dept=ex.dept;
      });
    }
    /* Événements réels */
    const le=(ev&&ev.events)||[];
    if(ev)S.evt=le.filter(e=>e.active!==false).map(e=>({id:e.id||uid(),titre:e.titre||e.title||"Événement",type:e.type||"Autre",
      date:String(e.date||today()).slice(0,10),fin:String(e.fin||e.date||"").slice(0,10),
      heure:e.heure||"",lieu:e.lieu||"",eg:S.eglises[0]?S.eglises[0].id:"",desc:e.desc||e.description||"",
      details:e.details||{}}));
    /* Comptes staff réels */
    const lu=(us&&us.users)||[];
    S.staff=lu.map(u=>({id:u.id,identifiant:u.identifiant||u.nom||u.username||"—",role:u.role,department:u.department||"",statut:u.statut}));
    if(!S.staff.length)S.staff=[{id:SESSION.id,identifiant:SESSION.username,role:SESSION.role,statut:"actif"}];
    S.users=S.staff.map(u=>({id:u.id,nom:u.identifiant,role:LIBELLE_ROLE[u.role]||u.role,statut:u.statut}));
    SERVER_ATTENDANCE=at?(at.attendance||[]):null;
    SERVER_REGISTRATIONS=regs?(regs.registrations||[]):null;
    S.att=[];
    S.me=SESSION.id;
    if(!S.users.some(u=>u.id===S.me))S.users.unshift({id:S.me,nom:SESSION.username,role:libelleRole(),statut:"actif"});
    if(S.cfg.name==="Église Shalom")S.cfg.name="Communauté CAM";
    save();
  }).catch(()=>{});
}

/* ---- Démarrage : session obligatoire ---- */
function boot(){
  fetch('/api/auth/me',{credentials:'same-origin'})
    .then(r=>r.ok?r.json():null).catch(()=>null)
    .then(d=>{
      if(!d||!d.user){location.replace('connexion.html');return null}
      SESSION=d.user;S.me=SESSION.id;
      if(!S.users.some(u=>u.id===S.me))S.users.unshift({id:S.me,nom:SESSION.username,role:libelleRole(),statut:"actif"});
      return hydrate();
    })
    .then(v=>{
      if(v===null)return;
      ANIM=true;DIR=0;render();
      const b=$("bell");if(b&&$("bdg").style.display!=="none")b.classList.add("sh");
      /* Filtre des cartes */
      const cq=$("carq");if(cq)cq.oninput=e=>{CAR_Q=e.target.value;render();const n=$("carq");if(n){n.focus();n.setSelectionRange(CAR_Q.length,CAR_Q.length)}};
      if(!accesComplet())toast("Accès restreint : "+libelleRole(),"warn");
    })
    .catch(()=>{location.replace('connexion.html')});
}

buildTop();$("main").innerHTML=skel();boot();
