<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex, nofollow">
<title>CAM — Bienvenue</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/cam-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="cam-fx.css">
<style>
  html,body{margin:0;min-height:100%;background:#000;color:#fff}
  .welcome{position:relative;min-height:100vh;display:flex;flex-direction:column;
    padding:26px 26px 34px;overflow:hidden;text-align:center;
    background:radial-gradient(ellipse at 50% 20%,#1a2c9e 0%,#071046 38%,#000 76%)}
  .welcome::before{content:"";position:absolute;width:520px;height:520px;border-radius:50%;
    background:radial-gradient(circle,rgba(47,85,255,.55),transparent 66%);top:-230px;left:50%;
    transform:translateX(-50%);filter:blur(20px);animation:fx-liquid 9s ease-in-out infinite}
  .welcome::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.3;
    background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
    background-size:44px 44px;
    -webkit-mask-image:radial-gradient(ellipse at center,#000 20%,transparent 75%);
    mask-image:radial-gradient(ellipse at center,#000 20%,transparent 75%)}
  .welcome > *{position:relative;z-index:1}

  /* CAM en haut à gauche — plus de logo central */
  .w-top{display:flex;align-items:center;gap:10px;text-align:left;margin-bottom:auto}
  .w-logo{width:48px;height:48px;object-fit:contain;border-radius:12px;background:#fff}
  .w-word{font:800 1.6em 'Bricolage Grotesque',Georgia,serif;letter-spacing:.02em;color:#fff}
  .w-top small{display:block;color:#b9c6ff;font-size:.7em;letter-spacing:1.4px;text-transform:uppercase}
  .w-bar{width:22px;height:3px;border-radius:2px;background:#2f55ff;flex:none}

  .w-center{margin:40px 0 26px}
  .w-title{font:800 clamp(2.1em,8vw,3em)/1.12 'Bricolage Grotesque',Georgia,serif;margin:0 0 14px;color:#fff}
  .w-title em{font-style:normal;color:#8aa6ff}
  .tag{color:#b9c6ff;font-size:.94em;max-width:320px;margin:0 auto;line-height:1.6}
  .sp{flex:1;min-height:52px}
  .actions{width:100%;max-width:340px;display:grid;gap:10px;margin:0 auto}
  .btn-start{width:100%;min-height:56px;border:0;border-radius:16px;font:700 1em 'Plus Jakarta Sans',sans-serif;
    color:#fff;background:linear-gradient(135deg,#3a63ff,#2f55ff);cursor:pointer;
    box-shadow:0 14px 34px rgba(47,85,255,.42);transition:transform .2s}
  .btn-start:hover{transform:translateY(-2px)}
  .btn-alt{width:100%;min-height:50px;border:1px solid rgba(255,255,255,.18);border-radius:16px;
    background:rgba(255,255,255,.06);color:#fff;font:600 .92em 'Plus Jakarta Sans',sans-serif;cursor:pointer}
  .btn-alt:hover{background:rgba(255,255,255,.12)}
  .legal{margin-top:20px;color:#8492c4;font-size:.72em;line-height:1.5}
  .legal a{color:#9db2ff}
  .dots{margin:26px 0 6px}
  @media (max-height:700px){.sp{min-height:24px}.w-center{margin:24px 0 18px}.w-title{font-size:2.2em}}
</style>
</head>
<body data-theme="blue">
<main class="welcome fx-gradient-bg">
  <header class="w-top fx-logo-reveal">
    <img class="w-logo" data-dashboard-logo src="icons/metanoia-192.png" alt="Logo Metanoïa">
    <div><span class="w-word">CAM</span><small>Espace membres</small></div>
  </header>

  <div class="w-center fx-onboarding-stagger">
    <h1 class="w-title">Votre communauté,<br><em>au creux de la main.</em></h1>
    <p class="tag">Membres, cultes, présences, prières et messages — réunis dans un seul espace.</p>
  </div>

  <div class="sp"></div>
  <div class="fx-dots dots" id="dots" aria-hidden="true"></div>

  <div class="actions fx-onboarding-stagger">
    <button class="btn-start fx-magnetic fx-micro" id="start" type="button">Commencer →</button>
    <button class="btn-alt fx-micro" id="signin" type="button">J'ai déjà un compte</button>
  </div>

  <p class="legal">En continuant, vous accédez à l'espace réservé aux membres de la communauté CAM.<br>
    <a href="index.html">Conditions d'utilisation</a> · <a href="index.html">Confidentialité</a></p>
</main>

<script src="cam-fx.js"></script>
<script>
(function(){
  'use strict';
  try{
    var dashboardSettings=JSON.parse(localStorage.getItem('eglise-pro-1')||'null');
    var dashboardLogo=dashboardSettings&&dashboardSettings.cfg&&dashboardSettings.cfg.logo;
    if(typeof dashboardLogo==='string'&&dashboardLogo.indexOf('data:image/')===0){
      document.querySelectorAll('[data-dashboard-logo]').forEach(function(image){image.src=dashboardLogo});
    }
  }catch(error){console.warn('Le logo du tableau de bord n’a pas pu être chargé.',error);}
  if(window.CAMFX){
    CAMFX.dots(document.getElementById('dots'),0,3);
    CAMFX.magnetic(document.getElementById('start'),.18);
  }
  /* Page 2 = la connexion de l'application du dossier sans titre (index.html) */
  function aller(){window.location.href='index.html'}
  document.getElementById('start').addEventListener('click',function(){
    if(window.CAMFX){CAMFX.haptic(this);CAMFX.confetti(45)}
    setTimeout(aller,320);
  });
  document.getElementById('signin').addEventListener('click',aller);
})();
</script>
</body>
</html>
